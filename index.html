      // 3. STORAGE & STATE MANAGEMENT
      // Guest persistence + Smart Cart/Wishlist merge
      // ==========================================
      const LS_GUEST_CART = "sticksho_guest_cart";
      const LS_GUEST_WISH = "sticksho_guest_wish";
      const LS_AUTH_USER = "sticksho_auth_user";

      const AppContext = createContext();

      const AppProvider = ({ children }) => {
        // Current Route State
        const [route, setRoute] = useState(() => {
          const hash = window.location.hash.replace(/^#/, "");
          return hash || "/";
        });

        // Authentication State
        const [user, setUser] = useState(() => {
          try {
            const raw = localStorage.getItem(LS_AUTH_USER);
            return raw ? JSON.parse(raw) : null;
          } catch {
            return null;
          }
        });

        // Cart State
        const [cart, setCart] = useState(() => {
          try {
            const savedUser = JSON.parse(
              localStorage.getItem(LS_AUTH_USER) || "null",
            );
            const key = savedUser
              ? `sticksho_cart_${savedUser.email}`
              : LS_GUEST_CART;
            return JSON.parse(localStorage.getItem(key) || "[]");
          } catch {
            return [];
          }
        });

        // Wishlist State
        const [wishlist, setWishlist] = useState(() => {
          try {
            const savedUser = JSON.parse(
              localStorage.getItem(LS_AUTH_USER) || "null",
            );
            const key = savedUser
              ? `sticksho_wish_${savedUser.email}`
              : LS_GUEST_WISH;
            return JSON.parse(localStorage.getItem(key) || "[]");
          } catch {
            return [];
          }
        });

        // Auth Modal State
        const [isAuthOpen, setIsAuthOpen] = useState(false);
        const [authIntent, setAuthIntent] = useState(null); // 'checkout' or general

        // Toast Feedback
        const [toasts, setToasts] = useState([]);

        const addToast = (message, type = "success") => {
          const id = Date.now() + Math.random();
          setToasts((prev) => [...prev, { id, message, type }]);
          setTimeout(() => {
            setToasts((prev) => prev.filter((t) => t.id !== id));
          }, 2800);
        };

        // Navigation handler with hash routing for complete iframe compatibility
        const navigate = (path) => {
          window.location.hash = path;
          setRoute(path);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        useEffect(() => {
          const handleHashChange = () => {
            const hash = window.location.hash.replace(/^#/, "");
            setRoute(hash || "/");
          };
          window.addEventListener("hashchange", handleHashChange);
          return () =>
            window.removeEventListener("hashchange", handleHashChange);
        }, []);

        // Synchronize Cart to Storage
        useEffect(() => {
          const key = user ? `sticksho_cart_${user.email}` : LS_GUEST_CART;
          localStorage.setItem(key, JSON.stringify(cart));
        }, [cart, user]);

        // Synchronize Wishlist to Storage
        useEffect(() => {
          const key = user ? `sticksho_wish_${user.email}` : LS_GUEST_WISH;
          localStorage.setItem(key, JSON.stringify(wishlist));
        }, [wishlist, user]);

        // Actions
        const addToCart = (productId, quantity = 1) => {
          const prod = PRODUCTS.find((p) => p.id === productId);
          if (!prod) return;

          setCart((prev) => {
            const existing = prev.find((item) => item.id === productId);
            if (existing) {
              return prev.map((item) =>
                item.id === productId
                  ? { ...item, qty: Math.min(20, item.qty + quantity) }
                  : item,
              );
            }
            return [...prev, { id: productId, qty: quantity }];
          });
          addToast(`Slapped "${prod.name}" into cart! 💥`);
        };

        const updateCartQty = (productId, newQty) => {
          if (newQty <= 0) {
            removeFromCart(productId);
            return;
          }
          setCart((prev) =>
            prev.map((item) =>
              item.id === productId
                ? { ...item, qty: Math.min(20, newQty) }
                : item,
            ),
          );
        };

        const removeFromCart = (productId) => {
          const prod = PRODUCTS.find((p) => p.id === productId);
          setCart((prev) => prev.filter((item) => item.id !== productId));
          if (prod) addToast(`Removed "${prod.name}"`, "info");
        };

        const clearCart = () => {
          setCart([]);
        };

        const toggleWishlist = (productId) => {
          const prod = PRODUCTS.find((p) => p.id === productId);
          if (wishlist.includes(productId)) {
            setWishlist((prev) => prev.filter((id) => id !== productId));
            addToast(`Removed from Wishlist`);
          } else {
            setWishlist((prev) => [...prev, productId]);
            addToast(`Saved "${prod ? prod.name : "Sticker"}" to Wishlist! ❤️`);
          }
        };

        // Smart Authentication with CART MERGE (Never overwriting guest cart)
        const loginOrSignup = ({ name, email, phone }) => {
          const normalizedEmail = email.trim().toLowerCase();
          const newUser = {
            name: name.trim(),
            email: normalizedEmail,
            phone: phone.trim(),
          };

          // 1. Fetch user's prior account cart/wishlist
          let priorCart = [];
          let priorWish = [];
          try {
            priorCart = JSON.parse(
              localStorage.getItem(`sticksho_cart_${normalizedEmail}`) || "[]",
            );
            priorWish = JSON.parse(
              localStorage.getItem(`sticksho_wish_${normalizedEmail}`) || "[]",
            );
          } catch (e) {}

          // 2. Merge guest cart without duplicate items
          const mergedCart = [...priorCart];
          cart.forEach((guestItem) => {
            const matchIndex = mergedCart.findIndex(
              (m) => m.id === guestItem.id,
            );
            if (matchIndex > -1) {
              mergedCart[matchIndex].qty = Math.min(
                20,
                mergedCart[matchIndex].qty + guestItem.qty,
              );
            } else {
              mergedCart.push({ ...guestItem });
            }
          });

          // 3. Merge wishlist
          const mergedWish = Array.from(new Set([...priorWish, ...wishlist]));

          // 4. Commit to state and storage
          setUser(newUser);
          setCart(mergedCart);
          setWishlist(mergedWish);

          localStorage.setItem(LS_AUTH_USER, JSON.stringify(newUser));
          localStorage.setItem(
            `sticksho_cart_${normalizedEmail}`,
            JSON.stringify(mergedCart),
          );
          localStorage.setItem(
            `sticksho_wish_${normalizedEmail}`,
            JSON.stringify(mergedWish),
          );

          // Clear guest keys to prevent re-merging on next logout
          localStorage.removeItem(LS_GUEST_CART);
          localStorage.removeItem(LS_GUEST_WISH);

          setIsAuthOpen(false);
          addToast(`Welcome back, ${newUser.name}! Cart synced ✨`);

          if (authIntent === "checkout") {
            navigate("/checkout");
          }
          setAuthIntent(null);
        };

        const logout = () => {
          setUser(null);
          localStorage.removeItem(LS_AUTH_USER);
          // Reset to empty guest cart
          setCart([]);
          setWishlist([]);
          addToast("Logged out of Delhi account", "info");
          navigate("/");
        };

          const items = cart
            .map((item) => {
              const prod = PRODUCTS.find((p) => p.id === item.id);
              if (!prod) return null;
              return {
                ...prod,
                qty: item.qty,
                lineTotal: prod.price * item.qty,
              };
            })
            .filter(Boolean);

          const subtotal = items.reduce((sum, item) => sum + item.lineTotal, 0);
          // Free delivery over ₹500 across all 13 Delhi districts, else ₹40
          const deliveryCharge = subtotal === 0 ? 0 : subtotal >= 500 ? 0 : 40;
          const finalTotal = subtotal + deliveryCharge;
          const totalItemsCount = items.reduce((sum, i) => sum + i.qty, 0);

          return {
            items,
            subtotal,
            deliveryCharge,
            finalTotal,
            totalItemsCount,
          };
        }, [cart]);

          <AppContext.Provider
            value={{

              setIsAuthOpen,

        const { cartDetails, user, navigate, clearCart } = useApp();

        // Guard: Redirect if empty

          if (cartDetails.items.length === 0) {
            navigate("/cart");

        // Form State

        const [email, setEmail] = useState(user ? user.email : "");
        const [district, setDistrict] = useState("");
        const [localitySearch, setLocalitySearch] = useState("");
        const [selectedLocality, setSelectedLocality] = useState("");
        const [isLocalityDropdownOpen, setIsLocalityDropdownOpen] =
          useState(false);
        const [houseDetails, setHouseDetails] = useState("");
        const [streetAreaDetails, setStreetAreaDetails] = useState("");
        const [pincode, setPincode] = useState("");
        const [deliveryInstructions, setDeliveryInstructions] = useState("");

        // Validation Errors
        const [errors, setErrors] = useState({});
        const [isSubmittedModalOpen, setIsSubmittedModalOpen] = useState(false);
        const [generatedWaUrl, setGeneratedWaUrl] = useState("");
        const [generatedMessageText, setGeneratedMessageText] = useState("");

        const localityInputRef = useRef(null);

        // Filtered Localities based on selected district and search input
        const availableLocalities = useMemo(() => {
          if (!district || !DELHI_LOCATION_DATA[district]) return [];
          if (!localitySearch.trim()) return DELHI_LOCATION_DATA[district];
          const q = localitySearch.toLowerCase();
          return DELHI_LOCATION_DATA[district].filter((loc) =>
            loc.toLowerCase().includes(q),
          );
        }, [district, localitySearch]);

        // Handle District Change
        const handleDistrictChange = (e) => {
          const newDist = e.target.value;
          setDistrict(newDist);
          setSelectedLocality("");
          setLocalitySearch("");
          setIsLocalityDropdownOpen(false);
          // Clear dependent errors
          setErrors((prev) => ({ ...prev, district: "", locality: "" }));
        };

        // Handle Locality Selection
        const handleSelectLocality = (loc) => {
          setSelectedLocality(loc);
          setLocalitySearch(loc);
          setIsLocalityDropdownOpen(false);
          setErrors((prev) => ({ ...prev, locality: "" }));
        };

        // Progressive Unlock State Machine
        const isDistrictUnlocked = true;
        const isLocalityUnlocked = Boolean(district);
        const isHouseUnlocked = Boolean(district && selectedLocality);
        const isStreetUnlocked = Boolean(
          isHouseUnlocked && houseDetails.trim().length > 0,
        );
        const isPincodeUnlocked = Boolean(
          isStreetUnlocked && streetAreaDetails.trim().length > 0,
        );
        const isInstructionsUnlocked = isPincodeUnlocked;

        // Validate Form
        const validate = () => {
          const errs = {};
          if (!fullName.trim()) errs.fullName = "Please enter your full name";

          // 10 digit Indian mobile starting with 6-9
          if (!phone.trim() || !/^[6-9]\d{9}$/.test(phone.trim())) {
            errs.phone =
              "Enter a valid 10-digit Delhi mobile number (starts with 6-9)";
          }

          // Email regex
          if (
            !email.trim() ||
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())
          ) {
            errs.email = "Enter a valid email for dispatch updates";
          }

          if (!district) {
            errs.district = "Select an official Delhi Revenue District";
          }

          if (
            !selectedLocality ||
            !DELHI_LOCATION_DATA[district]?.includes(selectedLocality)
          ) {
            errs.locality =
              "Select a verified Delhi area from the dropdown options";
          }

          if (!houseDetails.trim()) {
            errs.houseDetails = "Provide your House / Flat / Building / Floor";
          }

          if (!streetAreaDetails.trim()) {
            errs.streetAreaDetails =
              "Provide street, block, colony, or landmark";
          }

          // 6 digit Delhi Pincode (starts with 11)
          if (!pincode.trim() || !/^\d{6}$/.test(pincode.trim())) {
            errs.pincode = "Enter a valid 6-digit Delhi Pincode (e.g. 110001)";
          }

          setErrors(errs);
          return Object.keys(errs).length === 0;
        };

        // WhatsApp Message Generator
        const handlePlaceOrderWhatsApp = (e) => {
          e.preventDefault();
          if (!validate()) {
            window.scrollTo({ top: 300, behavior: "smooth" });
            return;
          }

          // Build clean message strictly adhering to the prompt format
          const itemsList = cartDetails.items
            .map(
              (it, idx) =>
                `${idx + 1}. ${it.name} × ${it.qty} — ₹${it.lineTotal}`,
            )
            .join("\n");

          const messageLines = [
            "STICKSHO ORDER",
            "",
            "Customer Details",
            `Name: ${fullName.trim()}`,
            `Phone: ${phone.trim()}`,
            `Email: ${email.trim()}`,
            "",
            "Delivery Address",
            `House: ${houseDetails.trim()}`,
            `Street/Area: ${streetAreaDetails.trim()}`,
            `Locality: ${selectedLocality}`,
            `District: ${district}`,
            "City: Delhi",
            "State: Delhi",
            `Pincode: ${pincode.trim()}`,
          ];

          if (deliveryInstructions.trim()) {
            messageLines.push(`Instructions: ${deliveryInstructions.trim()}`);
          }

          messageLines.push(
            "",
            "Order Items",
            itemsList,
            "",
            `Subtotal: ₹${cartDetails.subtotal}`,
            `Delivery: ${cartDetails.deliveryCharge === 0 ? "FREE" : `₹${cartDetails.deliveryCharge}`}`,
            `Total: ₹${cartDetails.finalTotal}`,
            "",
            "Please confirm my order.",
          );

          const fullMessage = messageLines.join("\n");
          const encoded = encodeURIComponent(fullMessage);
          const waUrl = `https://wa.me/919650727640?text=${encoded}`;

          setGeneratedMessageText(fullMessage);
          setGeneratedWaUrl(waUrl);
          setIsSubmittedModalOpen(true);

          // Open WhatsApp directly in new window
          window.open(waUrl, "_blank");
        };

        return (

                      </label>
                      <input

                        value={fullName}

                        className="w-full bg-sand/40 sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                      />
                      {errors.fullName && (

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-extrabold mb-1">
                          Mobile Phone (WhatsApp) *
                        </label>
                        <input
                          type="tel"
                          maxLength="10"
                          value={phone}
                          onChange={(e) => {
                            setPhone(e.target.value.replace(/\D/g, ""));

                          }}
                          placeholder="10-digit number"
                          className="w-full bg-sand/40 sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                        />
                        {errors.phone && (
                          <p className="text-[11px] text-coral font-bold mt-1">

                          </p>

                      </div>

                      <div>
                        <label className="block text-xs font-extrabold mb-1">
                          Email Address *

                        <input
                          type="email"
                          value={email}
                          onChange={(e) => {
                            setEmail(e.target.value);
                            setErrors((prev) => ({ ...prev, email: "" }));
                          }}
                          placeholder="kabir@example.com"
                          className="w-full bg-sand/40 sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                        />
                        {errors.email && (
                          <p className="text-[11px] text-coral font-bold mt-1">
                            {errors.email}
                          </p>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* 2. Delhi Address Form (Progressively Unlocked) */}
                  <div className="space-y-4 pt-4">
                    <div className="flex items-center justify-between border-b-2 border-ink pb-2">
                      <div className="flex items-center gap-2">
                        <span className="w-6 h-6 rounded-full bg-lemon sticker-border text-xs font-black grid place-items-center">
                          2
                        </span>
                        <h2 className="font-display font-extrabold text-base">
                          Delhi Delivery Location
                        </h2>
                      </div>
                      <span className="text-[10px] font-extrabold bg-mint sticker-border px-2 py-0.5 rounded">
                        OFFICIAL 13 DISTRICTS
                      </span>
                    </div>

                    {/* Fixed State & District Select */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-extrabold mb-1">
                          State / Territory
                        </label>
                        <input
                          type="text"
                          value="Delhi (NCT)"
                          disabled
                          className="w-full bg-lemon/50 sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-extrabold text-ink cursor-not-allowed"
                        />
                        <span className="text-[10px] text-ink/60 font-semibold">
                          Strictly non-NCR (Delhi only)
                        </span>
                      </div>

                      <div>
                        <label className="block text-xs font-extrabold mb-1">
                          District *
                        </label>
                        <select
                          value={district}
                          onChange={handleDistrictChange}
                          className="w-full bg-sand/40 sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-extrabold outline-none focus:bg-white cursor-pointer"
                        >
                          <option value="">-- Choose Delhi District --</option>
                          {DELHI_DISTRICTS.map((d) => (
                            <option key={d} value={d}>
                              {d}
                            </option>
                          ))}
                        </select>
                        {errors.district && (
                          <p className="text-[11px] text-coral font-bold mt-1">
                            {errors.district}
                          </p>
                        )}
                      </div>
                    </div>

                    {/* Searchable Locality Combobox */}
                    <div className="relative">
                      <label className="block text-xs font-extrabold mb-1">
                        Locality / Sub-Division Area *
                        {!isLocalityUnlocked && (
                          <span className="text-ink/40 font-normal ml-1">
                            (Select district above first)
                          </span>
                        )}
                      </label>

                      <div className="relative">
                        <input
                          ref={localityInputRef}
                          type="text"
                          disabled={!isLocalityUnlocked}
                          value={localitySearch}
                          onChange={(e) => {
                            setLocalitySearch(e.target.value);
                            setSelectedLocality("");
                            setIsLocalityDropdownOpen(true);
                            setErrors((prev) => ({ ...prev, locality: "" }));
                          }}
                          onFocus={() => {
                            if (isLocalityUnlocked)
                              setIsLocalityDropdownOpen(true);
                          }}
                          placeholder={
                            isLocalityUnlocked
                              ? `Search locality in ${district}...`
                              : "Choose district above to enable"
                          }
                          className="w-full bg-sand/40 disabled:bg-sand/20 disabled:cursor-not-allowed sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                        />
                        {selectedLocality && (
                          <span className="absolute right-3 top-2.5 text-mint font-extrabold text-xs">
                            ✓ Verified
                          </span>
                        )}
                      </div>

                      {/* Dropdown menu */}
                      {isLocalityDropdownOpen && isLocalityUnlocked && (
                        <div className="absolute left-0 right-0 top-full mt-1.5 bg-white sticker-border rounded-xl shadow-sticker-lg max-h-48 overflow-y-auto z-30 p-1">
                          {availableLocalities.length === 0 ? (
                            <div className="p-3 text-xs text-ink/60 font-semibold text-center">
                              No official locality found in {district}.
                            </div>
                          ) : (
                            availableLocalities.map((loc) => (
                              <button
                                type="button"
                                key={loc}
                                onClick={() => handleSelectLocality(loc)}
                                className={`w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition flex items-center justify-between ${
                                  selectedLocality === loc
                                    ? "bg-lemon text-ink"
                                    : "hover:bg-sand/60"
                                }`}
                              >
                                <span>{loc}</span>
                                <span className="text-[10px] text-ink/40">
                                  {district}
                                </span>
                              </button>
                            ))
                          )}
                        </div>
                      )}
                      {errors.locality && (
                        <p className="text-[11px] text-coral font-bold mt-1">
                          {errors.locality}
                        </p>
                      )}
                    </div>

                    {/* House / Flat / Building Free Text */}
                    <div>
                      <label className="block text-xs font-extrabold mb-1">
                        House / Flat / Building / Floor *
                        {!isHouseUnlocked && (
                          <span className="text-ink/40 font-normal ml-1">
                            (Requires Locality)
                          </span>
                        )}
                      </label>
                      <input
                        type="text"
                        disabled={!isHouseUnlocked}
                        value={houseDetails}
                        onChange={(e) => {
                          setHouseDetails(e.target.value);
                          setErrors((prev) => ({ ...prev, houseDetails: "" }));
                        }}
                        placeholder="e.g. Flat 302, Tower B, Sunshine Apartments"
                        className="w-full bg-sand/40 disabled:bg-sand/20 disabled:cursor-not-allowed sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                      />
                      {errors.houseDetails && (
                        <p className="text-[11px] text-coral font-bold mt-1">
                          {errors.houseDetails}
                        </p>
                      )}
                    </div>

                    {/* Street / Area / Landmark Free Text */}
                    <div>
                      <label className="block text-xs font-extrabold mb-1">
                        Street / Area / Locality Details *
                        {!isStreetUnlocked && (
                          <span className="text-ink/40 font-normal ml-1">
                            (Requires House Details)
                          </span>
                        )}
                      </label>
                      <textarea
                        rows="2"
                        disabled={!isStreetUnlocked}
                        value={streetAreaDetails}
                        onChange={(e) => {
                          setStreetAreaDetails(e.target.value);
                          setErrors((prev) => ({
                            ...prev,
                            streetAreaDetails: "",
                          }));
                        }}
                        placeholder="e.g. Near Mother Dairy, Block 7, Main Market Road"
                        className="w-full bg-sand/40 disabled:bg-sand/20 disabled:cursor-not-allowed sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:bg-white resize-none"
                      />
                      {errors.streetAreaDetails && (
                        <p className="text-[11px] text-coral font-bold mt-1">
                          {errors.streetAreaDetails}
                        </p>
                      )}
                    </div>

                    {/* 6-Digit Pincode */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-extrabold mb-1">
                          Pincode (6 Digits) *
                          {!isPincodeUnlocked && (
                            <span className="text-ink/40 font-normal ml-1">
                              (Unlock above)
                            </span>
                          )}
                        </label>
                        <input
                          type="text"
                          maxLength="6"
                          disabled={!isPincodeUnlocked}
                          value={pincode}
                          onChange={(e) => {
                            setPincode(e.target.value.replace(/\D/g, ""));
                            setErrors((prev) => ({ ...prev, pincode: "" }));
                          }}
                          placeholder="1100XX"
                          className="w-full bg-sand/40 disabled:bg-sand/20 disabled:cursor-not-allowed sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                        />
                        {errors.pincode && (
                          <p className="text-[11px] text-coral font-bold mt-1">
                            {errors.pincode}
                          </p>
                        )}
                      </div>

                      <div>
                        <label className="block text-xs font-extrabold mb-1">
                          City
                        </label>
                        <input
                          type="text"
                          value="Delhi"
                          disabled
                          className="w-full bg-sand/20 sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-extrabold text-ink cursor-not-allowed"
                        />
                      </div>
                    </div>

                    {/* Delivery Instructions */}
                    <div>
                      <label className="block text-xs font-extrabold mb-1">
                        Delivery Instructions (Optional)
                      </label>
                      <input
                        type="text"
                        disabled={!isInstructionsUnlocked}
                        value={deliveryInstructions}
                        onChange={(e) =>
                          setDeliveryInstructions(e.target.value)
                        }
                        placeholder="e.g. Ring bell, deliver after 4 PM, call guard"
                        className="w-full bg-sand/40 disabled:bg-sand/20 disabled:cursor-not-allowed sticker-border rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                      />
                    </div>
                  </div>

                  {/* Submit Action */}
                  <div className="pt-4 border-t-2 border-ink">
                    <button
                      type="submit"
                      className="w-full bg-[#25D366] hover:bg-[#20ba5a] text-white sticker-border rounded-2xl py-4 px-4 font-display font-extrabold text-base sm:text-lg shadow-sticker hover:-translate-y-0.5 transition flex items-center justify-center gap-3"
                    >
                      <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <path d="M19.05 4.94A9.91 9.91 0 0 0 12.04 2C6.58 2 2.13 6.45 2.13 10.91c0 1.57.41 3.1 1.19 4.45L2 22l6.82-1.79a9.87 9.87 0 0 0 4.72 1.2h.02c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01l-.02-.45ZM12.06 19.6h-.02a8.03 8.03 0 0 1-4.1-1.12l-.3-.18-4.05 1.06 1.08-3.95-.2-.4a8.1 8.1 0 0 1-1.24-4.1c0-4.48 3.65-8.13 8.14-8.13 2.17 0 4.21.85 5.74 2.39a8.06 8.06 0 0 1 2.39 5.74c0 4.48-3.65 8.14-8.14 8.14l.6-.45Z" />
                      </svg>
                      <span>Place Order on WhatsApp</span>
                    </button>

                    <p className="text-[11px] text-ink/60 text-center font-medium mt-2">
                      Clicking opens WhatsApp chat with{" "}
                      <strong>9650727640</strong> with your order pre-populated.
                    </p>
                  </div>
                </form>
              </div>

              {/* Order Summary & Live Address Preview (5 cols) */}
              <div className="lg:col-span-5 space-y-5 sticky top-24">
                {/* Order Items Review */}
                <div className="bg-white sticker-border rounded-3xl p-6 shadow-sticker space-y-4">
                  <h3 className="font-display font-extrabold text-lg border-b-2 border-ink pb-2">
                    Order Items ({cartDetails.totalItemsCount})
                  </h3>

                  <div className="max-h-60 overflow-y-auto space-y-3 pr-1">
                    {cartDetails.items.map((it) => (
                      <div
                        key={it.id}
                        className="flex items-center justify-between text-xs font-bold bg-sand/30 p-2.5 rounded-xl border border-ink/10"
                      >
                        <div className="flex items-center gap-2 min-w-0">
                          <img
                            src={it.images[0]}
                            className="w-10 h-10 object-cover rounded-lg sticker-border shrink-0"
                            alt=""
                          />
                          <div className="min-w-0">
                            <div className="truncate font-extrabold">
                              {it.name}
                            </div>
                            <div className="text-[10px] text-ink/50">
                              {it.qty} × ₹{it.price}
                            </div>
                          </div>
                        </div>
                        <span className="font-display font-extrabold text-sm shrink-0">
                          ₹{it.lineTotal}
                        </span>
                      </div>
                    ))}
                  </div>

                  <div className="border-t-2 border-dashed border-ink/15 pt-3 space-y-1.5 text-xs font-bold">
                    <div className="flex justify-between text-ink/70">
                      <span>Subtotal</span>
                      <span>₹{cartDetails.subtotal}</span>
                    </div>
                    <div className="flex justify-between text-ink/70">
                      <span>Delivery (Delhi)</span>
                      <span>
                        {cartDetails.deliveryCharge === 0
                          ? "FREE"
                          : `₹${cartDetails.deliveryCharge}`}
                      </span>
                    </div>
                    <div className="flex justify-between text-base font-extrabold pt-2 border-t border-ink/10">
                      <span>Final Amount</span>
                      <span className="font-display text-lg">
                        ₹{cartDetails.finalTotal}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Live Address Preview Card */}
                <div className="bg-sand/60 sticker-border rounded-3xl p-6 shadow-sticker space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className="font-display font-extrabold text-sm uppercase tracking-wider text-ink/60">
                      Destination Preview
                    </h4>
                    <span className="text-[10px] font-extrabold bg-lemon px-2 py-0.5 rounded sticker-border">
                      DELHI NCR EXCLUSIVE
                    </span>
                  </div>

                  <div className="text-xs space-y-1 font-medium bg-white sticker-border rounded-2xl p-4 shadow-sticker-sm">
                    <div className="font-extrabold text-sm text-ink mb-1">
                      {fullName || "Recipient Name"}
                    </div>
                    <div className="text-ink/80">
                      {phone || "10-digit Phone"} • {email || "Email"}
                    </div>
                    <div className="text-ink/90 pt-1">
                      {houseDetails ? `${houseDetails}, ` : "House/Flat, "}
                      {streetAreaDetails
                        ? `${streetAreaDetails}, `
                        : "Street/Area, "}
                    </div>
                    <div className="font-bold text-ink">
                      {selectedLocality || "Locality"}, {district || "District"}
                      , Delhi {pincode ? `- ${pincode}` : ""}
                    </div>
                    {deliveryInstructions && (
                      <div className="text-[11px] text-coral font-bold italic pt-1">
                        Note: {deliveryInstructions}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {/* Submission Modal & Fallback */}
            {isSubmittedModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink/70 backdrop-blur-sm">
                <div className="bg-white sticker-border-thick rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-sticker-lg space-y-5 animate-wiggle">
                  <div className="w-14 h-14 rounded-full bg-[#25D366] text-white sticker-border grid place-items-center text-3xl mx-auto shadow-sticker-sm">
                    ✓
                  </div>

                  <div className="text-center space-y-1">
                    <h2 className="font-display font-extrabold text-2xl sm:text-3xl">
                      Dispatch Window Opened!
                    </h2>
                    <p className="text-xs text-ink/70 font-medium max-w-sm mx-auto">
                      Your pre-formatted message was sent to WhatsApp. Press{" "}
                      <strong>"Send"</strong> in WhatsApp to lock in your order
                      with our Delhi pack crew.
                    </p>
                  </div>

                  {/* Message Preview Box */}
                  <div className="bg-sand/50 sticker-border rounded-2xl p-4 max-h-48 overflow-y-auto text-left">
                    <div className="text-[10px] font-extrabold uppercase text-ink/50 mb-1">
                      Populated WhatsApp Message
                    </div>
                    <pre className="text-[11px] font-mono whitespace-pre-wrap text-ink/90 font-medium">
                      {generatedMessageText}
                    </pre>
                  </div>

                  <div className="space-y-2">
                    <a
                      href={generatedWaUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="block w-full text-center bg-[#25D366] text-white sticker-border rounded-xl py-3 text-xs font-extrabold shadow-sticker-sm hover:-translate-y-0.5 transition"
                    >
                      Open WhatsApp Again (Chat: 9650727640)
                    </a>

                    <button
                      type="button"
                      onClick={() => {
                        setIsSubmittedModalOpen(false);
                        clearCart();
                        navigate("/");
                      }}
                      className="block w-full text-center bg-sand hover:bg-sand/80 text-ink sticker-border rounded-xl py-2.5 text-xs font-extrabold"
                    >
                      Done! Return to Homepage
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      // ==========================================
      // 12. AUTH MODAL (Guest preservation + Merge)
      // ==========================================
      const AuthModal = () => {
        const { isAuthOpen, setIsAuthOpen, loginOrSignup } = useApp();
        const [isSignup, setIsSignup] = useState(false);
        const [name, setName] = useState("");
        const [email, setEmail] = useState("");
        const [phone, setPhone] = useState("");
        const [error, setError] = useState("");

        if (!isAuthOpen) return null;

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!name.trim()) {
            setError("Please provide your name");
            return;
          }
          if (
            !email.trim() ||
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())
          ) {
            setError("Enter a valid email address");
            return;
          }
          if (!phone.trim() || !/^[6-9]\d{9}$/.test(phone.trim())) {
            setError("Enter a valid 10-digit mobile number");
            return;
          }

          setError("");
          loginOrSignup({ name, email, phone });
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink/70 backdrop-blur-sm">
            <div className="bg-white sticker-border-thick rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-sticker-lg space-y-5">
              {/* Header */}
              <div className="flex items-start justify-between">
                <div>
                  <span className="text-[10px] font-extrabold bg-lemon sticker-border px-2 py-0.5 rounded uppercase">
                    DELHI STICKER PASS
                  </span>
                  <h2 className="font-display font-extrabold text-2xl sm:text-3xl mt-1">
                    {isSignup ? "Create Account" : "Welcome Back"}
                  </h2>
                  <p className="text-xs text-ink/70 font-medium mt-0.5">
                    Guest bag & wishlist items will be preserved and merged
                    automatically.
                  </p>
                </div>

                <button
                  type="button"
                  onClick={() => setIsAuthOpen(false)}
                  className="w-8 h-8 rounded-full bg-sand sticker-border grid place-items-center text-xs font-bold hover:bg-coral hover:text-white transition"
                >
                  ✕
                </button>
              </div>

              {/* Toggle */}
              <div className="flex bg-sand/60 sticker-border rounded-xl p-1 gap-1 text-xs font-extrabold">
                <button
                  type="button"
                  onClick={() => {
                    setIsSignup(false);
                    setError("");
                  }}
                  className={`flex-1 py-1.5 rounded-lg transition ${
                    !isSignup
                      ? "bg-white sticker-border shadow-sticker-sm text-ink"
                      : "text-ink/60 hover:text-ink"
                  }`}
                >
                  Login
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setIsSignup(true);
                    setError("");
                  }}
                  className={`flex-1 py-1.5 rounded-lg transition ${
                    isSignup
                      ? "bg-white sticker-border shadow-sticker-sm text-ink"
                      : "text-ink/60 hover:text-ink"
                  }`}
                >
                  Sign Up
                </button>
              </div>

              {error && (
                <div className="bg-coral/10 border border-coral text-coral rounded-xl p-2.5 text-xs font-bold text-center">
                  {error}
                </div>
              )}

              {/* Form */}
              <form onSubmit={handleSubmit} className="space-y-3.5">
                <div>
                  <label className="block text-xs font-extrabold mb-1">
                    Your Name
                  </label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="e.g. John Doe"
                    className="w-full bg-sand/40 sticker-border rounded-xl px-3.5 py-2 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                  />
                </div>

                <div>
                  <label className="block text-xs font-extrabold mb-1">
                    Email Address
                  </label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="john@example.com"
                    className="w-full bg-sand/40 sticker-border rounded-xl px-3.5 py-2 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                  />
                </div>

                <div>
                  <label className="block text-xs font-extrabold mb-1">
                    WhatsApp Mobile (10 Digits)
                  </label>
                  <input
                    type="tel"
                    maxLength="10"
                    value={phone}
                    onChange={(e) =>
                      setPhone(e.target.value.replace(/\D/g, ""))
                    }
                    placeholder="9876543210"
                    className="w-full bg-sand/40 sticker-border rounded-xl px-3.5 py-2 text-xs sm:text-sm font-semibold outline-none focus:bg-white"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full bg-lemon hover:bg-lemon/90 text-ink sticker-border rounded-2xl py-3 font-display font-extrabold text-sm shadow-sticker hover:-translate-y-0.5 transition mt-2"
                >
                  {isSignup ? "Sign Up & Merge Bag" : "Login & Proceed"}
                </button>
              </form>

              <p className="text-[10px] text-ink/50 text-center font-medium">
                By proceeding, you verify your delivery location falls inside
                Delhi territory.
              </p>
            </div>
          </div>
        );
      };

      // ==========================================
      // 13. TOAST FEEDBACK NOTIFICATIONS
      // ==========================================
      const ToastContainer = () => {
        const { toasts } = useApp();
        if (toasts.length === 0) return null;

        return (
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map((t) => (
              <div
                key={t.id}
                className={`toast-anim pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-2xl sticker-border shadow-sticker font-display font-extrabold text-xs sm:text-sm ${
                  t.type === "info" ? "bg-sand text-ink" : "bg-lemon text-ink"
                }`}
              >
                <span>{t.type === "info" ? "ℹ️" : "💥"}</span>
                <span>{t.message}</span>
              </div>
            ))}
          </div>
        );
      };

      // ==========================================
      // 14. ROUTER COMPONENT
      // ==========================================
      const MainApp = () => {
        const { route } = useApp();

        const renderView = () => {
          const cleanPath = route.split("?")[0];

          if (cleanPath === "/" || cleanPath === "") {
            return <HomePage />;
          }
          if (cleanPath === "/products") {
            return <ProductsPage />;
          }
          if (cleanPath.startsWith("/products/")) {
            const id = cleanPath.replace("/products/", "");
            return <ProductDetailPage id={id} />;
          }
          if (cleanPath === "/cart") {
            return <CartPage />;
          }
          if (cleanPath === "/wishlist") {
            return <WishlistPage />;
          }
          if (cleanPath === "/checkout") {
            return <CheckoutPage />;
          }

          return <HomePage />;
        };

        return (
          <div className="min-h-screen flex flex-col bg-paper">
            <Header />
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6">
              {renderView()}
            </main>
            <Footer />
            <AuthModal />
            <ToastContainer />
          </div>
        );
      };

      // ==========================================
      // 15. ROOT MOUNT
      // ==========================================
      const rootElement = document.getElementById("root");
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <AppProvider>
          <MainApp />
        </AppProvider>,
      );
    </script>
  </body>
</html>
